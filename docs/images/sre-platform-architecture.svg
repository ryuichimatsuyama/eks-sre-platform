<rect width="100%" height="100%" fill="white"/>
<text x="30" y="48" class="h1" text-anchor="start"><tspan x="30" dy="0">SRE Platform Architecture</tspan></text><text x="30" y="78" class="body" text-anchor="start"><tspan x="30" dy="0">GitOps-managed Kubernetes platform on AWS • Multi-AZ (3 AZs) • Terraform multi-provider</tspan></text><rect x="720" y="20" width="250" height="55" rx="10" fill="#fff" stroke="#94A3B8" stroke-width="2"/><text x="845" y="43" class="body" text-anchor="middle"><tspan x="845" dy="0">Users</tspan><tspan x="845" dy="18">Internet</tspan></text><rect x="690" y="105" width="310" height="75" rx="10" fill="#fff" stroke="#94A3B8" stroke-width="2"/><text x="845" y="130" class="body" text-anchor="middle"><tspan x="845" dy="0">Cloudflare</tspan><tspan x="845" dy="17">Tunnel / WAF / Rate Limiting</tspan><tspan x="845" dy="17">shop.ryuichi-sre.com</tspan></text><path d="M845,75 L845,105" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="845.0" y="84.0" class="small" text-anchor="middle"><tspan x="845.0" dy="0">HTTPS</tspan></text><rect x="25" y="200" width="300" height="550" rx="10" fill="#fff" stroke="#94A3B8" stroke-width="2"/><text x="40" y="230" class="h2" text-anchor="start"><tspan x="40" dy="0">CI/CD &amp; Image Management (GitHub)</tspan></text><rect x="55" y="260" width="240" height="70" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/><text x="175" y="285" class="body" text-anchor="middle"><tspan x="175" dy="0">GitHub</tspan><tspan x="175" dy="18">Source Code / Pull Requests</tspan></text><rect x="55" y="370" width="240" height="95" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/><text x="175" y="395" class="body" text-anchor="middle"><tspan x="175" dy="0">GitHub Actions</tspan><tspan x="175" dy="18">Build / Test • Trivy</tspan><tspan x="175" dy="18">Manifest Validation • E2E</tspan></text><rect x="55" y="510" width="240" height="75" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/><text x="175" y="535" class="body" text-anchor="middle"><tspan x="175" dy="0">GitHub Container Registry (GHCR)</tspan><tspan x="175" dy="18">ghcr.io/ryuichimatsuyama/*</tspan></text><rect x="55" y="630" width="240" height="75" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/><text x="175" y="655" class="body" text-anchor="middle"><tspan x="175" dy="0">Renovate</tspan><tspan x="175" dy="18">Release Image PR / Dependency Updates</tspan></text><path d="M175,330 L175,370" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M175,465 L175,510" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="175.0" y="481.5" class="small" text-anchor="middle"><tspan x="175.0" dy="0">Image Push</tspan></text><path d="M175,585 L175,630" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="355" y="200" width="950" height="550" rx="10" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><text x="375" y="230" class="h2" text-anchor="start"><tspan x="375" dy="0">AWS • ap-northeast-1</tspan></text><rect x="385" y="250" width="890" height="475" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/><text x="405" y="280" class="h2" text-anchor="start"><tspan x="405" dy="0">VPC 10.0.0.0/16</tspan></text><rect x="430" y="300" width="210" height="125" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 5"/><text x="535" y="325" class="body" text-anchor="middle"><tspan x="535" dy="0">Availability Zone 1</tspan><tspan x="535" dy="17">ap-northeast-1a</tspan></text><rect x="455" y="355" width="160" height="55" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/><text x="535" y="377" class="small" text-anchor="middle"><tspan x="535" dy="0">Private Subnet</tspan><tspan x="535" dy="15">10.0.0.0/20</tspan><tspan x="535" dy="15">EKS subnet</tspan></text><rect x="680" y="300" width="210" height="125" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 5"/><text x="785" y="325" class="body" text-anchor="middle"><tspan x="785" dy="0">Availability Zone 2</tspan><tspan x="785" dy="17">ap-northeast-1c</tspan></text><rect x="705" y="355" width="160" height="55" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/><text x="785" y="377" class="small" text-anchor="middle"><tspan x="785" dy="0">Private Subnet</tspan><tspan x="785" dy="15">10.0.16.0/20</tspan><tspan x="785" dy="15">EKS subnet</tspan></text><rect x="930" y="300" width="210" height="125" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 5"/><text x="1035" y="325" class="body" text-anchor="middle"><tspan x="1035" dy="0">Availability Zone 3</tspan><tspan x="1035" dy="17">ap-northeast-1d</tspan></text><rect x="955" y="355" width="160" height="55" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/><text x="1035" y="377" class="small" text-anchor="middle"><tspan x="1035" dy="0">Private Subnet</tspan><tspan x="1035" dy="15">10.0.32.0/20</tspan><tspan x="1035" dy="15">EKS subnet</tspan></text><rect x="410" y="450" width="840" height="250" rx="10" fill="#F8FAFC" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 5"/><text x="430" y="480" class="h2" text-anchor="start"><tspan x="430" dy="0">Amazon EKS (Kubernetes Cluster)</tspan></text><text x="430" y="502" class="small" text-anchor="start"><tspan x="430" dy="0">Uses private subnets across 3 AZs</tspan></text><rect x="435" y="535" width="230" height="125" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/><text x="550.0" y="560" class="small" text-anchor="middle"><tspan x="550.0" dy="0">Argo CD</tspan><tspan x="550.0" dy="16">Bootstrap: Terraform + Helm</tspan><tspan x="550.0" dy="16">Then manages cluster resources via GitOps,</tspan><tspan x="550.0" dy="16">including Argo CD itself</tspan></text><rect x="690" y="535" width="165" height="125" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/><text x="772.5" y="560" class="small" text-anchor="middle"><tspan x="772.5" dy="0">Applications</tspan><tspan x="772.5" dy="16">• Online Boutique</tspan><tspan x="772.5" dy="16">• PR Environments</tspan></text><rect x="875" y="535" width="165" height="125" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="1"/><text x="957.5" y="560" class="small" text-anchor="middle"><tspan x="957.5" dy="0">Platform Components</tspan><tspan x="957.5" dy="16">• Argo Rollouts</tspan><tspan x="957.5" dy="16">• Istio</tspan><tspan x="957.5" dy="16">• cloudflared</tspan></text><rect x="1060" y="525" width="165" height="145" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1142.5" y="550" class="small" text-anchor="middle"><tspan x="1142.5" dy="0">Observability Stack</tspan><tspan x="1142.5" dy="16">• Prometheus / SLO</tspan><tspan x="1142.5" dy="16">• Grafana</tspan><tspan x="1142.5" dy="16">• Loki</tspan><tspan x="1142.5" dy="16">• OpenTelemetry</tspan><tspan x="1142.5" dy="16">• Jaeger</tspan><tspan x="1142.5" dy="16">• Alertmanager</tspan></text><path d="M295,295 L435,570" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/><text x="365.0" y="426.5" class="small" text-anchor="middle"><tspan x="365.0" dy="0">Desired state / Sync</tspan></text><path d="M665,595 L690,595" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/><text x="677.5" y="589.0" class="small" text-anchor="middle"><tspan x="677.5" dy="0">GitOps</tspan></text><path d="M665,605 L875,605" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/><path d="M665,615 L1060,615" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/><path d="M845,180 L845,450" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="845.0" y="309.0" class="small" text-anchor="middle"><tspan x="845.0" dy="0">User traffic via Tunnel</tspan></text><path d="M957,535 L1000,180" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGreen)"/><text x="978.5" y="351.5" class="small" text-anchor="middle"><tspan x="978.5" dy="0">Outbound cloudflared connection</tspan></text><rect x="1340" y="500" width="190" height="105" rx="10" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2"/><text x="1435" y="530" class="body" text-anchor="middle"><tspan x="1435" dy="0">PagerDuty</tspan><tspan x="1435" dy="18">Incident Management</tspan><tspan x="1435" dy="18">On-call Alerts</tspan></text><path d="M1225,610 L1340,552" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGreen)"/><text x="1282.5" y="575.0" class="small" text-anchor="middle"><tspan x="1282.5" dy="0">Alerts</tspan></text><rect x="25" y="785" width="1280" height="180" rx="10" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2"/><text x="45" y="815" class="h2" text-anchor="start"><tspan x="45" dy="0">Infrastructure &amp; Platform Configuration as Code (Terraform)</tspan></text><rect x="55" y="850" width="210" height="75" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1"/><text x="160.0" y="878" class="small" text-anchor="middle"><tspan x="160.0" dy="0">Terraform</tspan><tspan x="160.0" dy="18">Multi-provider configuration</tspan></text><rect x="315" y="850" width="205" height="75" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="417.5" y="878" class="small" text-anchor="middle"><tspan x="417.5" dy="0">AWS</tspan><tspan x="417.5" dy="18">VPC / EKS / IAM / etc.</tspan></text><rect x="550" y="850" width="215" height="75" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="657.5" y="878" class="small" text-anchor="middle"><tspan x="657.5" dy="0">GitHub</tspan><tspan x="657.5" dy="18">Repositories / Actions / Apps / Branch Protection</tspan></text><rect x="795" y="850" width="215" height="75" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="902.5" y="878" class="small" text-anchor="middle"><tspan x="902.5" dy="0">Cloudflare</tspan><tspan x="902.5" dy="18">DNS / Tunnel / WAF / Rules</tspan></text><rect x="1040" y="850" width="215" height="75" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="1147.5" y="878" class="small" text-anchor="middle"><tspan x="1147.5" dy="0">PagerDuty</tspan><tspan x="1147.5" dy="18">Teams / Services / Policies</tspan></text><path d="M265,887 L315,887" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/><path d="M265,887 L550,887" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/><path d="M265,887 L795,887" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/><path d="M265,887 L1040,887" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/><path d="M417,850 L550,660" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowPurple)"/><text x="483.5" y="749.0" class="small" text-anchor="middle"><tspan x="483.5" dy="0">Provision EKS + bootstrap Argo CD</tspan></text><rect x="1340" y="785" width="190" height="145" rx="10" fill="#fff" stroke="#94A3B8" stroke-width="2"/><text x="1360" y="815" class="h2" text-anchor="start"><tspan x="1360" dy="0">Legend</tspan></text><text x="1360" y="842" class="small" text-anchor="start"><tspan x="1360" dy="0">Black: user traffic</tspan><tspan x="1360" dy="20">Blue: GitOps / Sync</tspan><tspan x="1360" dy="20">Green: external integration</tspan><tspan x="1360" dy="20">Purple: Terraform managed</tspan></text></svg>